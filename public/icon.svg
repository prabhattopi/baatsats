<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Bitcoin Gold Gradient -->
    <linearGradient id="btc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f7931a" />
    </linearGradient>

    <!-- Lightning Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f7931a" stroke-width="4" stroke-opacity="0.3" />

  <!-- Left Audio Waves (Voice / Baat) -->
  <g stroke="#f7931a" stroke-linecap="round" opacity="0.75" stroke-width="10">
    <line x1="84" y1="230" x2="84" y2="282" />
    <line x1="112" y1="200" x2="112" y2="312" />
    <line x1="140" y1="170" x2="140" y2="342" />
  </g>

  <!-- Right Audio Waves (Voice / Baat) -->
  <g stroke="#f7931a" stroke-linecap="round" opacity="0.75" stroke-width="10">
    <line x1="372" y1="170" x2="372" y2="342" />
    <line x1="400" y1="200" x2="400" y2="312" />
    <line x1="428" y1="230" x2="428" y2="282" />
  </g>

  <!-- Center Bitcoin Shield Circle -->
  <circle cx="256" cy="256" r="140" fill="#0f172a" stroke="#334155" stroke-width="6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#btc-grad)" stroke-width="4" opacity="0.6" />

  <!-- Lightning Bolt (⚡ / Sats) -->
  <polygon points="275,145 200,268 252,268 237,367 312,244 260,244" fill="url(#btc-grad)" filter="url(#glow)" />
</svg>